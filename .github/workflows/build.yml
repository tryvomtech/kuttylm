# Builds KuttyLM for Linux (.deb, .AppImage), Windows (.exe installer) and macOS (.dmg, Apple Silicon).
# Start it by hand (Actions tab → Build → Run workflow) to test a build.
# The files appear under the run's "Artifacts". Releases use release.yml (tags like v0.1.0).
name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest supported Ubuntu, so the packages run on 22.04 and 24.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest # Apple Silicon (arm64)
            name: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Get the model engine (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/fetch-llama-server.sh

      - name: Get the model engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-llama-server.ps1

      - name: Get the model engine (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/fetch-llama-server-macos.sh

      - run: npm ci

      - name: Check and test
        run: |
          npm run check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build packages
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: kuttylm-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
