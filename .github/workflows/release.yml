# Makes a KuttyLM release with installers for Windows, macOS and Linux.
#
# How to release:
#   1. Set the same version in package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json.
#   2. Push a tag with that version:  git tag v0.1.0 && git push origin v0.1.0
#   3. Wait for this workflow. It creates a DRAFT release with all files.
#   4. On GitHub, open Releases, check the draft, then click "Publish release".
#
# The text of the release comes from docs/release-notes.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the version
        id: version
        run: |
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "package.json=$PKG tauri.conf.json=$CONF Cargo.toml=$CARGO"
          if [ "$PKG" != "$CONF" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::The version is not the same in package.json, tauri.conf.json and Cargo.toml."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version v$PKG."
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        id: create
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const tag = `v${process.env.VERSION}`;
            // A published release for this tag already exists (for example, the tag was
            // pushed again): do nothing, so the published files are not touched.
            try {
              await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag });
              core.notice(`Release ${tag} already exists. Nothing to build.`);
              return '';
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `KuttyLM ${process.env.VERSION}`,
              body: fs.readFileSync('docs/release-notes.md', 'utf8'),
              draft: true,
              prerelease: false,
            });
            return String(data.id);

  build:
    needs: create-release
    # Skipped when the release already existed (see above).
    if: needs.create-release.outputs.release_id != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest supported Ubuntu, so the packages run on 22.04 and 24.04
          - os: windows-latest
          - os: macos-latest # Apple Silicon (arm64)
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Get the model engine (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/fetch-llama-server.sh

      - name: Get the model engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-llama-server.ps1

      - name: Get the model engine (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/fetch-llama-server-macos.sh

      - run: npm ci

      - name: Check and test
        run: |
          npm run check
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the installers
        run: npm run tauri build

      # Fixed file names (no version), so the README can link to
      # https://github.com/tryvomtech/kuttylm/releases/latest/download/<name>
      - name: Add the installers to the draft release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const bundle = 'src-tauri/target/release/bundle';
            const wanted = [
              { dir: 'nsis', ext: '.exe', name: 'KuttyLM-Windows-Setup.exe' },
              { dir: 'dmg', ext: '.dmg', name: 'KuttyLM-Mac.dmg' },
              { dir: 'deb', ext: '.deb', name: 'KuttyLM-Linux.deb' },
              { dir: 'appimage', ext: '.AppImage', name: 'KuttyLM-Linux.AppImage' },
            ];
            let uploaded = 0;
            for (const w of wanted) {
              const dir = path.join(bundle, w.dir);
              if (!fs.existsSync(dir)) continue;
              const files = fs.readdirSync(dir).filter((f) => f.endsWith(w.ext));
              if (files.length !== 1) {
                core.setFailed(`Expected one ${w.ext} file in ${dir}, found ${files.length}: ${files.join(', ')}`);
                return;
              }
              const data = fs.readFileSync(path.join(dir, files[0]));
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: Number(process.env.RELEASE_ID),
                name: w.name,
                data,
                headers: { 'content-type': 'application/octet-stream', 'content-length': data.length },
              });
              core.info(`Uploaded ${files[0]} as ${w.name} (${(data.length / 1e6).toFixed(1)} MB)`);
              uploaded++;
            }
            if (uploaded === 0) core.setFailed('No installer was found to upload.');
