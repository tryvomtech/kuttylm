# Use the system C compiler by full path. A different program named `cc`
# earlier in PATH (for example ~/.local/bin/cc) would otherwise break linking.
[target.x86_64-unknown-linux-gnu]
linker = "/usr/bin/cc"

[env]
# For build scripts that compile C code (the `cc` crate), Linux builds only.
# An explicit value in the environment still wins.
CC_x86_64_unknown_linux_gnu = { value = "/usr/bin/cc", force = false }
